<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuition Center</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f4f6ff;}

/* HEADER */
header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 20px;
    background:#1e3a8a;
    color:white;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:45px;height:45px;border-radius:50%;
}

/* NAV */
nav a{
    color:white;
    text-decoration:none;
    margin:0 10px;
    font-weight:bold;
}

/* HERO */
.hero{
    text-align:center;
    padding:90px 20px;
    background:linear-gradient(#2563eb,#1e3a8a);
    color:white;
}

.btn{
    padding:10px 15px;
    background:#ffd700;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:5px;
    margin-top:10px;
}

/* SECTIONS */
section{
    padding:50px 20px;
    text-align:center;
}

.card{
    display:inline-block;
    padding:20px;
    margin:10px;
    background:white;
    border-radius:10px;
    width:220px;
}

/* WHATSAPP BUTTON */
.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    background:#25D366;
    color:white;
    padding:12px 15px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <img src="https://drive.google.com/uc?export=view&id=13V-rBxBwVa77BewDumtBmb4pFDIf2Z1C">
        <h3>My Tuition</h3>
    </div>

    <nav>
        <a href="#home">Home</a>
        <a href="#courses">Courses</a>
        <a href="login.html">Student Login</a>
    </nav>
</header>

<!-- HERO -->
<div class="hero" id="home">
    <h1>Welcome Students</h1>
    <p>Learn Smart • Score High</p>
    <button class="btn" onclick="document.getElementById('courses').scrollIntoView()">View Courses</button>
</div>

<!-- COURSES -->
<section id="courses">
    <h2>Courses</h2>

    <div class="card">Maths</div>
    <div class="card">Science</div>
    <div class="card">English</div>
</section>

<!-- WHATSAPP -->
<a class="whatsapp" href="https://wa.me/919876543210" target="_blank">
💬 WhatsApp
</a>

</body>
</html>
